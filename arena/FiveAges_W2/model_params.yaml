# Arena registration for FiveAges W2 (draft — finish by measuring the live stage).
# Install into an Arena_W2 checkout:
#   mkdir -p arena_robots/arena_robots/robots/FiveAges_W2
#   cp this file → .../robots/FiveAges_W2/model_params.yaml
# Then rebuild/refresh install share so `robot:=FiveAges_W2` resolves.
#
# Chassis is LinkHou S2 (holonomic). Art root in FaSim W2 is base_link.
# Head camera prim (FaSim env): Head_V1/head_link2/head_camera/head_camera
# Confirm lidar topic + camera prim after the first Isaac Play.

observation_sources_string: lidar
observation_sources:
  - lidar
observation_sources_string_global: lidar
collision_monitor_sources:
  - lidar
observation_sources_dict:
  lidar:
    # After launch, run: ros2 topic list | rg -i 'scan|lidar'
    # Then set this to the namespaced LaserScan (Arena remaps under the robot ns).
    topic: ${namespace}/scan
    sensor_frame: ${frame}lidar_frame
    max_obstacle_height: 2.0
    clearing: true
    marking: true
    data_type: "LaserScan"
    raytrace_max_range: 8.0
    raytrace_min_range: 0.0
    obstacle_max_range: 2.0
    obstacle_min_range: 0.0
    observation_persistence: 0.0

robot_base_frame: base_link
robot_odom_frame: odom
robot_sensor_frame: lidar_frame
robot_model: FiveAges_W2

# Vendored via arena_robots/deps/robot_usds → fiveages-sim/fa-w2-usds
usd_redirect: ../../../deps/robot_usds/humanoid/FiveAges_W2/FiveAges_W2.usd

# Starting values from LinkHou_S2 registration; re-measure on the USD if Nav2 clips walls.
robot_radius: 0.35
scale: 1.0
footprint: "[ [0.28, 0.27], [0.28, -0.27], [-0.28, -0.27], [-0.28, 0.27] ]"
is_holonomic: true
# Wheel collisions bottom out 0.04 m below the USD origin. GRScenes floors are at
# z=0 after the cm->m scale, on every world. z=0 therefore starts the chassis in
# the floor; PhysX then shoves it up or flips it. 0.06 m leaves the wheels 2 cm
# above the floor on Reset Task.
z_offset: 0.06

max_vel_x: 0.4
max_vel_theta: 1.0
max_speed_xy: 0.4
velocity_smoother_max_velocity: [0.4, 0.4, 1.0]
velocity_smoother_min_velocity: [-0.4, -0.4, -1.0]
velocity_smoother_max_accel: [0.4, 0.4, 1.5]
velocity_smoother_max_decel: [-0.4, -0.4, -1.5]

# If LaserScan frame_id is not lidar_frame, add a static TF here.
# sensor_frame_transforms: []

data_logger:
  robot_stage_name: FiveAges_W2
  # Full prim = /World/Robots/<robot_stage_name>/<suffix>
  camera_prim_suffix: Head_V1/head_link2/head_camera/head_camera
  lidar_prim_suffix: base_link
  pedestrian_root_path: /World/Pedestrians

snapshot:
  head_camera_suffix: Head_V1/head_link2/head_camera/head_camera
  back_camera_suffix: Head_V1/head_link2/head_camera/head_camera
  topdown_half_extent: 6.0
  topdown_height: 3.0
